<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    
    <title>IPTV OSCORP</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #000000;
            --main-color: #FFD700;
            --font-xs: 1.8vh; --font-sm: 2.2vh; --font-md: 3vh; --font-lg: 5vh;
        }

        * { 
            margin: 0; padding: 0; box-sizing: border-box; outline: none; 
            -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;           
        }
        
        html, body {
            background: #000000; color: #ffffff; font-family: 'Montserrat', sans-serif;
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; 
            overflow: hidden !important; overscroll-behavior: none; touch-action: none;
            transform: translate3d(0,0,0); -webkit-transform: translate3d(0,0,0);
            backface-visibility: hidden; -webkit-backface-visibility: hidden;
        }

        .hide { display: none !important; }
        .flex-center { display: flex; align-items: center; justify-content: center; }
        .layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; background: transparent; overflow: hidden; }

        #orientation-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 99999; flex-direction: column; align-items: center; justify-content: center;
            color: var(--main-color); text-align: center; font-weight: 900; font-size: 3vh;
        }
        .phone-icon { font-size: 10vh; margin-bottom: 20px; animation: rotatePhone 2s infinite ease-in-out; }
        @keyframes rotatePhone { 0%, 100% { transform: rotate(0deg); opacity: 0; } 25%, 50% { transform: rotate(-90deg); opacity: 1; } 75% { transform: rotate(-90deg); opacity: 0; } }
        @media screen and (max-width: 768px) and (orientation: portrait) { #orientation-overlay { display: flex !important; } }

        button, .smart-card, .cat-item, .item, .power-btn, .key, .toggle-btn { cursor: pointer; }
        
        /* OTIMIZADO: Removido transições lentas e efeitos de scale/shadow para clique instantâneo */
        .focused { 
            border: 3px solid #fff !important; background: var(--main-color) !important; color: #000 !important; 
            z-index: 50; transform: translateZ(0) !important;
        }
        .focused i, .focused span, .focused div { color: #000 !important; }
        
        #item-list.flex-layout .item.focused .flex-title {
            color: #ffffff !important;
            /* Removido text-shadow pesado */
        }
        
        #vid-box.focused { border: 4px solid var(--main-color) !important; background: transparent !important; transform: none !important; }
        #vid-box.fs, #vid-box.fs.focused { border: none !important; width: 100% !important; height: 100% !important; z-index: 9999 !important; position: fixed !important; top: 0 !important; left: 0 !important; background: #000 !important; transform: none !important; }

        .login-box { width: 450px; max-width: 90%; padding: 40px; background: #0a0a0a; border: 2px solid var(--main-color); border-radius: 12px; text-align: center; }
        .logo-txt { font-size: 4.5vh; font-weight: 900; margin-bottom: 2.5vh; }
        .theme-text { color: var(--main-color); }
        .inp { width: 100%; padding: 16px; margin: 10px 0; background: #1a1a1a; border: 1px solid #333; color: #fff; text-align: center; font-weight: 600; border-radius: 8px; font-size: 16px; }
        .btn { width: 100%; padding: 16px; margin-top: 20px; background: var(--main-color); color: #000; border: none; font-weight: 900; border-radius: 8px; font-size: 16px; }

        .config-row { display: flex; gap: 1vw; margin: 2vh 0; }
        .toggle-btn { flex: 1; padding: 1.5vh; background: #1a1a1a; border: 1px solid #333; color: #888; font-size: var(--font-sm); font-weight: 800; border-radius: 1vh; }
        .info-row { display: flex; justify-content: space-between; padding: 1vh 0; border-bottom: 1px solid #222; font-size: var(--font-sm); color: #ccc; }
        
        #dash-layer { display: flex; flex-direction: column; padding: 4vh 4vw; height: 100%; overflow: hidden; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; height: 14vh; margin-bottom: 2vh; flex-shrink: 0; }
        .dash-logo { font-size: var(--font-lg); font-weight: 900; }
        .dash-clock { text-align: right; }
        .clock-time { font-size: 6vh; font-weight: 700; color: #eee; line-height: 1; }
        .clock-date { font-size: 2.5vh; color: #ccc; font-weight: 600; margin-top: 0.8vh; }
        
        .top-actions { display: flex; gap: 2vh; }
        .power-btn { width: 7vh; height: 7vh; font-size: 3.5vh; background: transparent; border: none; color: #666; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
        /* OTIMIZADO: Removido @keyframes pulse-btn pesada */
        .power-btn.focused { background: var(--main-color) !important; color: #000 !important; }

        .dash-grid { display: flex; gap: 4vw; justify-content: center; align-items: center; flex: 1; width: 100%; }
        .smart-card { width: 24vw; height: 50vh; background: #101010; border: 1px solid #333; border-radius: 2.5vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .smart-card i { font-size: 15vh; margin-bottom: 4vh; color: #444; }
        .smart-card span { font-size: 3.5vh; font-weight: 900; color: #fff; text-transform: uppercase; }
        .bottom-bar { display: flex; justify-content: space-between; margin-top: auto; padding-bottom: 1vh; flex-shrink: 0; }
        .info-pill { background: #111; padding: 1.5vh 2.5vw; border-radius: 50px; border: 1px solid #222; }
        .lbl { font-size: var(--font-xs); color: #999; display: block; font-weight: 700; }
        .val { font-size: var(--font-md); color: var(--main-color); font-weight: 900; }

        #content-layer { display: flex; width: 100%; height: 100%; background: #000; overflow: hidden; }
        .col-cat { width: 25%; background: #08080a; display: flex; flex-direction: column; border-right: 2px solid #1a1a1a; height: 100%; overflow: hidden; }
        .col-list { width: 35%; background: #101014; display: flex; flex-direction: column; border-right: 2px solid #1a1a1a; height: 100%; overflow: hidden; }
        .col-play { flex: 1; display: flex; flex-direction: column; position: relative; background: #000; height: 100%; overflow: hidden; }

        #content-layer.vod-mode .col-list { flex: 1; border-right: none; }
        #content-layer.vod-mode:not(.is-fs) .col-play { display: none; }
        #content-layer.vod-mode.is-fs .col-play { display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; }

        .cat-head { padding: 15px; background: #15151a; color: var(--main-color); border-bottom: 2px solid #222; text-align: center; font-size: var(--font-md); font-weight: 900; flex-shrink: 0; }
        .cat-top-row { display: flex; align-items: center; width: 100%; }
        
        .cat-list, .item-list { flex: 1; height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; will-change: transform; transform: translateZ(0); touch-action: pan-y; }
        
        .cat-item, .item { padding: 14px 20px; border-radius: 6px; margin: 6px 12px; color: #888; font-size: var(--font-sm); font-weight: 700; border: 1px solid transparent; }
        .cat-item.active { background: #1a1a1a; color: #fff; border-left: 4px solid var(--main-color); }
        
        .search-area { padding: 15px; background: #050505; border-bottom: 2px solid #1a1a1a; flex-shrink: 0; }
        .inp-search { width: 100%; padding: 12px; background: #111; border: 1px solid #333; color: #fff; font-size: var(--font-sm); font-weight: bold; border-radius: 6px; text-transform: uppercase; text-align: center; }
        
        .item { border-bottom: 1px solid #1a1a1a; }
        .item.playing { color: var(--main-color); background: #111; border-left: 4px solid var(--main-color); }
        .fav-icon { float: right; color: var(--main-color); z-index: 5;}

        /* OTIMIZADO: Grid Flexível e Limpo. Remove quebra de CSS nth-child pesada */
        #item-list.flex-layout { 
            display: flex; 
            flex-wrap: wrap;
            padding: 1.5%; 
            align-content: flex-start;
            justify-content: flex-start;
        }
        
        #item-list.flex-layout .item {
            width: 18.2%; /* Calcula exatamente ~5 colunas sem quebrar */
            margin: 0.9%; 
            border: 4px solid transparent; 
            border-radius: 6px; 
            background: #111; 
            display: flex; 
            flex-direction: column; 
            padding: 0; 
            position: relative;
            overflow: hidden; 
            backface-visibility: hidden;
            transform: translateZ(0);
        }

        #item-list.flex-layout .item.focused { 
            transform: translateZ(0) !important; 
            border-color: #fff !important; 
            background: #111 !important; 
            z-index: 2; 
        }
        
        .img-wrapper {
            position: relative;
            width: 100%;
            padding-top: 150%; 
            background: #050505;
            display: block;
        }

        .flex-img { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%; 
            height: 100%; 
            object-fit: fill; 
            border-radius: 2px 2px 0 0; 
            margin: 0; 
            display: block;
        }
        
        .flex-title { 
            font-size: 1.6vh; 
            color: #999; 
            width: 100%; 
            padding: 8px 4px; 
            white-space: normal; 
            word-wrap: break-word; 
            line-height: 1.3;
            font-weight: 700; 
            background: #15151a; 
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        #item-list.flex-layout .item.focused .flex-title {
            color: #ffffff !important;
            background: #1a1a1a !important; 
        }

        #item-list.flex-layout .item .fav-icon { position: absolute; top: 1vh; right: 1vh; font-size: 2.5vh; color: var(--main-color); z-index: 5;}

        .vid-box { 
            width: 100%; height: 50vh; background: #000; position: relative; border-bottom: 2px solid #222; overflow: hidden; flex-shrink: 0;
            touch-action: manipulation; transform: translateZ(0); 
        }
        
        #player-container { width:100%; height:100%; background:#000; transform: translateZ(0); }
        video { width: 100%; height: 100%; object-fit: fill; background: #000; z-index: 1; transform: translateZ(0); }

        .buffer-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 50; display: none; flex-direction: column; align-items: center; justify-content: center; }
        
        .buffer-spinner { font-size: 8vh; color: var(--main-color); }

        .meta { padding: 25px; flex: 1; height: 100%; overflow-y: auto; background: #0a0a0c; display: flex; flex-direction: column; }
        .meta-title { font-size: var(--font-lg); color: var(--main-color); font-weight: 900; margin-bottom: 1vh; }
        .meta-desc { font-size: var(--font-sm); color: #999; margin-bottom: 1vh; }
        
        .keys { display: flex; justify-content: space-between; align-items: center; gap: 1vw; padding-top: 2vh; border-top: 2px solid #1a1a1a; margin-top: auto; flex-shrink: 0; }
        .key { flex: 1; font-size: var(--font-xs); color: #fff; font-weight: 700; background: #1a1a1a; border: 1px solid #333; padding: 1.2vh 0.5vw; border-radius: 0.8vh; display: flex; align-items: center; justify-content: center; white-space: nowrap; }
        
        /* OTIMIZADO: Removido box-shadow das bolinhas coloridas */
        .dot { width: 1.2vh; height: 1.2vh; border-radius: 50%; flex-shrink: 0; margin-right: 1.2vw; }

        #loader { background: #000; z-index: 20000; flex-direction: column; color: var(--main-color); font-weight: 900; font-size: var(--font-lg); }
        #pause-layer { display: none; position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: 9000; align-items: center; justify-content: center; pointer-events: none; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
    </style>
</head>
<body onload="App.init()">

    <div id="orientation-overlay">
        <i class="fas fa-mobile-alt phone-icon"></i>
        <div>POR FAVOR<br><span style="color: var(--main-color);">GIRE A TELA</span></div>
    </div>

    <div id="loader" class="hide flex-center">
        <i class="fas fa-circle-notch fa-spin" style="margin-bottom:20px; font-size: 8vh;"></i>
        <div id="load-txt">CARREGANDO SISTEMA...</div>
    </div>

    <div id="login-layer" class="layer flex-center hide">
        <div class="login-box">
            <div class="logo-txt"><span style="color:#fff">IPTV</span>&nbsp;<span class="theme-text">OSCORP</span></div>
            <input type="text" id="i0" class="inp focusable" placeholder="URL DNS" autocomplete="off">
            <input type="text" id="i1" class="inp focusable" placeholder="USUÁRIO" autocomplete="off">
            <input type="password" id="i2" class="inp focusable" placeholder="SENHA" autocomplete="off">
            <button id="i3" class="btn focusable" onclick="App.login(false)">ENTRAR AGORA</button>
            <div id="msg-login" style="color:var(--main-color); margin-top:20px; font-size:var(--font-sm); font-weight: 800;"></div>
        </div>
    </div>

    <div id="settings-layer" class="layer hide flex-center">
        <div class="login-box">
            <div class="logo-txt" id="set-title-txt"><i class="fas fa-user-shield" style="margin-right:10px; color: var(--main-color);"></i>MINHA <span class="theme-text">CONTA</span></div>
            <div class="info-row"><span id="lbl-set-u">USUÁRIO:</span> <span id="set-user">...</span></div>
            <div class="info-row"><span id="lbl-set-d">CRIADO:</span> <span id="set-created">...</span></div>
            <div class="info-row"><span id="lbl-set-e">VENCIMENTO:</span> <span id="set-exp">...</span></div>
            <div class="info-row"><span id="lbl-set-c">TELAS:</span> <span id="set-conn">...</span></div>
            
            <div class="config-row" style="margin-top: 30px;"><div id="s0" class="toggle-btn focusable" style="border-color: #333; background: #111; cursor: default;">OPÇÕES</div></div>
            <div class="config-row">
                <div id="s1" class="toggle-btn focusable" onclick="App.toggleCfg('filter')"><span id="lbl-set-filter">XXX:</span> <span id="lbl-filter" style="color:#fff">NÃO</span></div>
                <div id="s2" class="toggle-btn focusable" onclick="App.toggleFormat()"><span id="lbl-set-format">FMT:</span> <span id="lbl-format" style="color:#fff">TS NAT</span></div>
            </div>
            
            <button id="s3" class="btn focusable" onclick="App.closeSettings()" style="background: #333; color: #fff; margin-top: 20px;">VOLTAR</button>
        </div>
    </div>

    <div id="dash-layer" class="layer hide">
        <div class="top-bar">
            <div class="dash-logo"><span style="color:#fff">IPTV</span>&nbsp;<span class="theme-text">OSCORP</span></div>
            <div class="dash-clock"><div id="clock-time" class="clock-time">--:--</div><div id="clock-date" class="clock-date">--/--/----</div></div>
            <div class="top-actions">
                <div id="m3" class="power-btn focusable" onclick="App.logout()"><i class="fas fa-power-off"></i></div>
            </div>
        </div>
        <div class="dash-grid">
            <div id="m0" class="smart-card focusable" role="button" tabindex="-1" onclick="App.openMode('live')"><i class="fas fa-satellite-dish"></i><span id="dash-m0">TV AO VIVO</span></div>
            <div id="m1" class="smart-card focusable" role="button" tabindex="-1" onclick="App.openMode('movie')"><i class="fas fa-film"></i><span id="dash-m1">FILMES</span></div>
            <div id="m2" class="smart-card focusable" role="button" tabindex="-1" onclick="App.openMode('series')"><i class="fas fa-layer-group"></i><span id="dash-m2">SÉRIES</span></div>
        </div>
        <div class="bottom-bar">
            <div class="info-pill"><span class="lbl" id="lbl-exp-txt">VENCIMENTO</span><span id="info-exp" class="val">...</span></div>
            <div class="info-pill" style="text-align: right;"><span class="lbl" id="lbl-conn-txt">CONEXÕES</span><span id="info-conn" class="val">...</span></div>
        </div>
    </div>

    <div id="content-layer" class="layer hide">
        <div class="col-cat">
            <div class="cat-head">
                <div class="cat-top-row">
                    <div id="cat-title-txt" style="flex:1;">MENU</div>
                </div>
                <div id="item-count" style="font-size: 0.7em; margin-top: 5px; opacity: 0.7;">TOTAL: ...</div>
            </div>
            <div id="cat-list" class="cat-list"></div>
        </div>
        
        <div class="col-list">
            <div class="search-area"><input type="text" id="search" class="inp-search focusable" placeholder="BUSCAR..." autocomplete="off"></div>
            <div id="item-list" class="item-list"></div>
        </div>
        
        <div class="col-play">
            <div id="vid-box" class="vid-box focusable" onclick="App.handleVideoTap(event)">
                <div id="player-container">
                    <video id="player" playsinline webkit-playsinline></video>
                </div>
                
                <div id="smart-buffer" class="buffer-overlay">
                    <i class="fas fa-circle-notch fa-spin buffer-spinner"></i>
                </div>

                <div id="pause-layer"><i class="fas fa-pause" style="font-size: 10vh; color: rgba(255, 255, 255, 0.9);"></i></div>
            </div>
            
            <div class="meta">
                <div id="meta-title" class="meta-title"><span style="color:#fff">IPTV</span>&nbsp;OSCORP</div>
                <div id="meta-desc" class="meta-desc"></div>
                
                <div class="keys">
                    <div class="key" id="key-fs"><div class="dot" style="background-color:#FF0000;"></div> TELA CHEIA</div>
                    <div class="key" id="key-top"><div class="dot" style="background-color:#00C851;"></div> TOPO</div>
                    <div class="key" id="key-search"><div class="dot" style="background-color:#ffbb33;"></div> BUSCAR</div>
                    <div class="key" id="key-menu" onclick="App.openSettings()"><div class="dot" style="background-color:#33b5e5;"></div> CONFIG.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function safePlay(vidElement) {
            if (!vidElement) return;
            try { 
                var p = vidElement.play(); 
                if (p !== undefined && typeof p.catch === 'function') { 
                    p.catch(function(e) {}); 
                } 
            } catch (e) {}
        }

        function requestNativeFullscreen(elem) {
            var target = elem || document.documentElement;
            try {
                if (target.requestFullscreen) { var p = target.requestFullscreen(); if(p !== undefined && typeof p.catch === 'function') { p.catch(function(){}); } } 
                else if (target.webkitRequestFullscreen) { target.webkitRequestFullscreen(); }
            } catch (e) {}
        }

        var FavManager = {
            key: 'rc_favs_smart', list: [],
            init: function() { var s = localStorage.getItem(this.key); this.list = s ? JSON.parse(s) : []; },
            toggle: function(id) { var idx = this.list.indexOf(id); if(idx > -1) this.list.splice(idx, 1); else this.list.push(id); localStorage.setItem(this.key, JSON.stringify(this.list)); if (App && App.renderList) App.renderList(); },
            isFav: function(id) { return this.list.indexOf(id) > -1; }
        };

        var PlayerEngine = {
            video: null, url: null, monitorTimer: null, lastTime: 0, stallCount: 0, retryCount: 0, isBuffering: false, maxRetries: 999999,

            init: function() { this.bindVideo(); },

            bindVideo: function() {
                this.video = document.getElementById('player'); 
                if(!this.video) return;
                
                this.video.onerror = function() { PlayerEngine.handleError(false); };
                this.video.onabort = function() { PlayerEngine.handleError(false); };
                this.video.onstalled = function() { PlayerEngine.showBuffer(); };
                
                this.video.onended = function() { 
                    if (App.currentMode === 'series' && App.fullData && App.fullData[App.idx] && App.fullData[App.idx].is_episode) {
                        var nextIdx = App.idx + 1;
                        if (nextIdx < App.fullData.length) { setTimeout(function() { App.itemClick(nextIdx, true); }, 50); return; }
                    }
                    PlayerEngine.handleError(false); 
                };

                this.video.addEventListener('playing', function() { PlayerEngine.onPlaySuccess(); });
                this.video.addEventListener('waiting', function() { PlayerEngine.showBuffer(); });
                this.video.controls = false;
            },

            resetDOM: function() {
                if(this.video) {
                    try { this.video.pause(); } catch(e){}
                    this.video.removeAttribute('src'); 
                    this.video.load(); 
                }
            },

            play: function(url) {
                if (!url) return;
                if(this.url === url && !this.video.error) {
                    if(this.video.paused) safePlay(this.video);
                    return;
                }
                if (this.url && this.url !== url) {
                    this.hardStop();
                    this.resetDOM(); 
                }
                this.url = url; this.stallCount = 0; this.retryCount = 0;
                this.showBuffer();
                document.getElementById('pause-layer').style.display = 'none';
                
                if(this.video) {
                    this.video.src = url; 
                    safePlay(this.video);
                }
                this.startMonitor();
            },
            
            onPlaySuccess: function() { this.stallCount = 0; this.retryCount = 0; this.hideBuffer(); },
            showBuffer: function() { this.isBuffering = true; var el = document.getElementById('smart-buffer'); if(el) el.style.display = 'flex'; },
            hideBuffer: function() { this.isBuffering = false; var el = document.getElementById('smart-buffer'); if(el) el.style.display = 'none'; },
            
            startMonitor: function() {
                this.stopMonitor();
                this.monitorTimer = setInterval(function() {
                    var v = PlayerEngine.video; 
                    if(!v || !PlayerEngine.url || v.paused) return;
                    if(Math.abs(v.currentTime - PlayerEngine.lastTime) < 0.1) {
                        PlayerEngine.stallCount++;
                        if(PlayerEngine.stallCount > 3) PlayerEngine.showBuffer();
                        if(PlayerEngine.stallCount > 6) { PlayerEngine.stallCount = 0; PlayerEngine.handleError(true); }
                    } else { 
                        PlayerEngine.stallCount = 0; PlayerEngine.lastTime = v.currentTime; 
                        if(PlayerEngine.isBuffering) PlayerEngine.hideBuffer();
                    }
                }, 2000);
            },
            stopMonitor: function() { if(this.monitorTimer) clearInterval(this.monitorTimer); },
            
            handleError: function(isStall) {
                var limit = (App && App.currentMode === 'live') ? this.maxRetries : 8; 
                
                if (this.retryCount < limit) {
                    this.retryCount++;
                    this.showBuffer();
                    this.resetDOM();
                    
                    var delay = Math.min(1000 * Math.pow(1.5, this.retryCount), 5000);
                    setTimeout(function() { 
                        if(PlayerEngine.video && PlayerEngine.url) {
                            PlayerEngine.video.src = PlayerEngine.url;
                            safePlay(PlayerEngine.video);
                        }
                    }, delay);
                } else {
                    this.hardStop();
                }
            },
            
            hardStop: function() { 
                this.stopMonitor();

                                var ep = d.episodes[seasonKey][i]; 
                                var rawTitle = (ep.title || ep.info.name || "").trim();
                                
                                ep.is_episode = true; 
                                ep.season_num = apiSeason; 
                                ep.episode_real_num = parseInt(ep.episode_num); 
                                ep.name = rawTitle; 
                                
                                eps.push(ep);
                            }
                        }
                        eps.sort(function(a, b) { if (a.season_num !== b.season_num) { return a.season_num - b.season_num; } return a.episode_real_num - b.episode_real_num; });
                        
                        App.fullData = null; 
                        App.fullData = eps; App.zone = 2; App.idx = 0; App.renderList(); 
                    } else { document.getElementById('item-list').innerHTML = '<div style="padding:20px; text-align:center;">'+t.no_ep+'</div>'; }
                };

                this.activeReqs.ep = this.req(this.creds.h+"/player_api.php?username="+this.creds.u+"&password="+this.creds.p+"&action=get_series_info&series_id="+series_id, function(d) {
                    App.activeReqs.ep = null;
                    if(!App.showingEpisodes) return; 
                    if(d && d!=='ERR_NET') { processEps(d); }
                });
            },

            playStream: function(item) {
                var id = item.stream_id || item.id; var url = ""; var t = App.i18n[App.cfg.lang];
                if (App.currentMode === 'live') {
                    var ext = this.cfg.format === 'm3u8_native' ? 'm3u8' : 'ts'; url = this.creds.h+"/live/"+this.creds.u+"/"+this.creds.p+"/"+id+"."+ext;
                    this.playingId = id; document.getElementById('meta-title').innerText = item.name || item.title; document.getElementById('meta-desc').innerText = "";
                } else if (App.currentMode === 'movie') {
                    var ext = item.container_extension || 'mp4'; url = this.creds.h+"/movie/"+this.creds.u+"/"+this.creds.p+"/"+id+"."+ext;
                    this.playingId = id; document.getElementById('meta-title').innerText = item.name || item.title || t.def_movie; document.getElementById('meta-desc').innerText = "";
                } else if (App.currentMode === 'series') {
                    var ext = item.container_extension || 'mp4'; url = this.creds.h+"/series/"+this.creds.u+"/"+this.creds.p+"/"+id+"."+ext;
                    this.playingId = id; document.getElementById('meta-title').innerText = item.name || item.title || t.def_ep; document.getElementById('meta-desc').innerText = "";
                }
                PlayerEngine.play(url); 
                var items = document.querySelectorAll('.item'); for(var k=0; k<items.length; k++) { items[k].classList.remove('playing'); }
                var r = document.getElementById('row-'+this.idx); if(r) r.classList.add('playing'); 
            },

            seek: function(sec) { if(App.currentMode === 'live') return; var v = document.getElementById('player'); if(v && v.duration) { v.currentTime += sec; } }, 
            
            switchChannel: function(dir) {
                if (this.currentMode !== 'live' || !this.fullData || this.fullData.length === 0) return;
                var n = this.idx + dir;
                if (n < 0) n = this.fullData.length - 1;
                if (n >= this.fullData.length) n = 0;
                this.itemClick(n, true);
            },

            syncFocusToPlaying: function() { 
                if(!this.playingId) return; 
                for(var i=0; i<this.fullData.length; i++) { 
                    var id = this.fullData[i].stream_id || this.fullData[i].series_id || this.fullData[i].id; 
                    if(id == this.playingId) { 
                        this.idx = i; this.renderList(); this.updateFocus(); return; 
                    } 
                } 
            },

            doSearch: function(isGlobal) {
                App.showingEpisodes = false; var rawT = document.getElementById('search').value; 
                if(rawT.length === 0) { 
                    if(App.lastCatIdx > -1) { App.loadContent(App.lastCatIdx); } else { document.getElementById('item-list').innerHTML = '<div style="padding:20px; text-align:center; color:#888; font-weight: bold; font-size: 2vh; margin-top: 20vh;">&larr; SELECIONE UMA CATEGORIA</div>'; App.fullData = []; App.renderList(); } return; 
                }
                if(rawT.length < 2) return; var tStr = App.removeAccents(rawT); var listEl = document.getElementById('item-list');
                
                if (App.currentMode !== 'live' && !App.showingEpisodes) { listEl.classList.add('flex-layout'); }

                if (isGlobal) {
                    this.abortReq('search'); this.abortReq('content');
                    listEl.innerHTML = '<div style="padding:20px; text-align:center; color: var(--main-color); font-size: 2vh;"><i class="fas fa-circle-notch fa-spin" style="font-size: 5vh; margin-bottom: 15px;"></i><br><br>BUSCANDO...</div>';
                    
                    var performSearch = function(data) {
                        var res = []; var maxResults = 100; var junk = ['adulto','xxx','sex','porn','+18'];
                        for(var i=0; i<data.length; i++) { 
                            var item = data[i];
                            if(!item._searchStr) { item._searchStr = App.removeAccents(item.name || item.title || ""); }
                            var show = true;
                            if(App.cfg.filter) { var lowerNome = (item.name || item.title || "").toLowerCase(); for(var j=0; j<junk.length; j++) { if(lowerNome.indexOf(junk[j]) > -1) { show = false; break; } } }
                            if(show && item._searchStr.indexOf(tStr) > -1) { res.push(item); if(res.length >= maxResults) break; } 
                        }
                        if (res.length > 0) { res.sort(App.smartSort); App.fullData = res; App.zone = 2; App.idx = 0; App.renderList(); } 
                        else { listEl.innerHTML = '<div style="padding:20px; text-align:center;">Nenhum resultado encontrado.</div>'; var countEl = document.getElementById('item-count'); if(countEl) countEl.innerText = App.i18n[App.cfg.lang].tot_pre + "0"; }
                    };

                    if (App.db[App.currentMode].global) {
                        setTimeout(function() { performSearch(App.db[App.currentMode].global); }, 10);
                    } else {
                        var actionStrm = App.currentMode === 'live' ? 'get_live_streams' : (App.currentMode === 'movie' ? 'get_vod_streams' : 'get_series');
                        this.activeReqs.search = App.req(App.creds.h+"/player_api.php?username="+App.creds.u+"&password="+App.creds.p+"&action="+actionStrm, function(d) { 
                            App.activeReqs.search = null;
                            if(d && d !== 'ERR_NET') { 
                                App.db[App.currentMode].global = d; 
                                performSearch(d);
                            } else { listEl.innerHTML = '<div style="padding:20px; text-align:center;">Erro na conexão.</div>'; }
                        });
                    }
                } else {
                    listEl.innerHTML = '<div style="padding:20px; text-align:center; color: var(--main-color); font-size: 30px;"><i class="fas fa-circle-notch fa-spin"></i></div>';
                    setTimeout(function() {
                        var baseData = App.categoryDataCache || App.fullData;
                        if (!baseData || baseData.length === 0) { listEl.innerHTML = '<div style="padding:20px; text-align:center;">'+App.i18n[App.cfg.lang].empty+'</div>'; return; }
                        var res = []; for(var i=0; i<baseData.length; i++) { var nome = baseData[i].name || baseData[i].title || ""; if(App.removeAccents(nome).indexOf(tStr) > -1) { res.push(baseData[i]); } }
                        if (res.length > 0) { App.fullData = res; App.renderList(); } else { listEl.innerHTML = '<div style="padding:20px; text-align:center; font-size:1.8vh; color:#888;">Não encontrado nesta categoria.<br><br><b style="color:var(--main-color);">APERTE ENTER PARA BUSCA GLOBAL</b></div>'; }
                    }, 50);
                }
            },
            
            handleVideoTap: function(e) {
                e.preventDefault(); if(!App.playingId) return; 
                var now = new Date().getTime(); var timeDiff = now - (App.lastTap || 0); App.lastTap = now;
                var rect = document.getElementById('vid-box').getBoundingClientRect();
                var clientX = e.clientX; if(e.changedTouches && e.changedTouches.length > 0) clientX = e.changedTouches[0].clientX;
                var x = (clientX || rect.width / 2) - rect.left; var width = rect.width;

                if (timeDiff < 300 && timeDiff > 0) { 
                    clearTimeout(App.tapTimer); 
                    if (App.currentMode !== 'live') { if (x < width * 0.33) { App.seek(-15); } else if (x > width * 0.66) { App.seek(15); } else { App.toggleFull(); } } else { App.toggleFull(); }
                } else { 
                    App.tapTimer = setTimeout(function() { if (App.currentMode !== 'live') { App.togglePlay(); } else { App.toggleFull(); } App.zone = 3; App.updateFocus(); }, 300); 
                }
            },
            
            togglePlay: function() { if(App.currentMode === 'live') return; var v = document.getElementById('player'); var layer = document.getElementById('pause-layer'); if(!v) return; if(v.paused) { v.play(); layer.style.display = 'none'; } else { v.pause(); layer.style.display = 'flex'; } }, 
            toggleFull: function() { 
                if(!this.playingId) return; 
                var b = document.getElementById('vid-box'); 
                if(b.classList.contains('fs')) { 
                    this.exitFull(); 
                } else { 
                    b.classList.add('fs'); 
                    document.getElementById('content-layer').classList.add('is-fs');
                    requestNativeFullscreen(b); 
                } 
            },
            exitFull: function() { 
                document.getElementById('vid-box').classList.remove('fs'); 
                document.getElementById('content-layer').classList.remove('is-fs');
                document.getElementById('pause-layer').style.display = 'none'; 
                try { if (document.exitFullscreen) { document.exitFullscreen(); } else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); } } catch(e) {} 
                
                if (App.currentMode !== 'live') {
                    PlayerEngine.hardStop();
                    App.playingId = null;
                    var items = document.querySelectorAll('.item'); 
                    for(var k=0; k<items.length; k++) { items[k].classList.remove('playing'); }
                } else {
                    this.syncFocusToPlaying(); 
                }

                this.zone = 2;
                this.updateFocus();
            },
            
            back: function(isTrusted) {
                if (!isTrusted && new Date().getTime() - (this.lastScreenSwitch || 0) < 500) return;
                if(document.getElementById('vid-box').classList.contains('fs')) { this.exitFull(); return; }
                if(this.zone===3) { this.zone=2; this.syncFocusToPlaying(); this.updateFocus(); return; }
                if(this.zone===2) { 
                    if(App.currentMode === 'series' && App.fullData.length > 0 && App.fullData[0].is_episode) { 
                        App.fullData = App.seriesDataCache; 
                        App.idx = App.lastSeriesIdx; 
                        App.showingEpisodes = false; 
                        document.getElementById('item-list').classList.add('flex-layout');
                        App.renderList(); 
                        App.updateFocus(); 
                        return; 
                    } 
                    this.zone=0; this.idx=(this.lastCatIdx > -1 ? this.lastCatIdx : 0); this.updateFocus(); return; 
                }
                if(this.zone===1) { this.zone=2; this.idx=0; this.updateFocus(); return; }
                if(this.zone===0) { this.setScr(1); return; }
            },
            
            updateFocus: function() {
                if (this.lastFocusedEl) {
                    this.lastFocusedEl.classList.remove('focused');
                } else {
                    var focusedItems = document.querySelectorAll('.focused'); 
                    for(var k=0; k<focusedItems.length; k++) { focusedItems[k].classList.remove('focused'); }
                }

                var el; 
                if(this.scr===0) el=document.getElementById('i'+this.idx); 
                if(this.scr===1) el=document.getElementById('m'+this.idx); 
                if(this.scr===3) el=document.getElementById('s'+this.idx);
                if(this.scr===2) { 
                    if(this.zone===0) el=document.getElementById('c'+this.idx); 
                    if(this.zone===1) el=document.getElementById('search'); 
                    if(this.zone===2) el=document.getElementById('row-'+this.idx); 
                    if(this.zone===3) el=document.getElementById('vid-box'); 
                }
                
                if(el) { 
                    el.classList.add('focused'); 
                    this.lastFocusedEl = el; 
                    
                    if(el.tagName==='INPUT') { 
                        try { el.focus({preventScroll:true}); } catch(e) { el.focus(); } 
                    } else { 
                        var inps = document.querySelectorAll('input'); 
                        for(var i=0; i<inps.length; i++) { inps[i].blur(); } 
                        if (document.activeElement && document.activeElement !== document.body) { try { document.activeElement.blur(); } catch(e) {} } 
                    } 
                    
                    if(el.tagName!=='INPUT') {
                        var listEl = document.getElementById('item-list');
                        var catEl = document.getElementById('cat-list');
                        
                        if (this.zone === 2 && listEl) {
                            listEl.scrollTop = el.offsetTop - (listEl.clientHeight / 2) + (el.clientHeight / 2);
                        } else if (this.zone === 0 && catEl) {
                            catEl.scrollTop = el.offsetTop - (catEl.clientHeight / 2) + (el.clientHeight / 2);
                        }
                    }
                }
            },
            
            move: function(d) {
                var s = this.scr;
                if(s===0) { if(d===1 && this.idx < 3) this.idx++; if(d===0 && this.idx > 0) this.idx--; }
                else if(s===1) { 
                    if(this.idx === 0) { if(d===3) this.idx=1; else if(d===0) this.idx=3; } 
                    else if(this.idx === 1) { if(d===3) this.idx=2; else if(d===2) this.idx=0; else if(d===0) this.idx=3; } 
                    else if(this.idx === 2) { if(d===2) this.idx=1; else if(d===0) this.idx=3; } 
                    else if(this.idx === 3) { if(d===1) this.idx=0; } 
                }
                else if(s===3) { 
                    if(this.idx === 0) { 
                        if(d===1) this.idx = 1; 
                    } else if(this.idx === 1) { 
                        if(d===3) this.idx = 2; else if(d===1) this.idx = 3; else if(d===0) this.idx = 0; 
                    } else if(this.idx === 2) { 
                        if(d===2) this.idx = 1; else if(d===1) this.idx = 3; else if(d===0) this.idx = 0; 
                    } else if(this.idx === 3) { 
                        if(d===0) this.idx = 1;
                    } 
                }
                else if(s===2) {
                    if(this.zone===3) { if(d===2) { this.zone=2; this.syncFocusToPlaying(); this.updateFocus(); } return; }
                    if(this.zone===0) { var max = document.getElementById('cat-list').children.length-1; if(d===1 && this.idx<max) this.idx++; if(d===0 && this.idx>0) this.idx--; if(d===3 && App.fullData.length>0) { this.zone=2; this.idx=0; App.renderList(); } }
                    else if(this.zone===2) { 
                        var dataLen = App.fullData.length;
                        var listEl = document.getElementById('item-list');
                        var isFlex = listEl.classList.contains('flex-layout');

                        if (isFlex) {
                            var cols = 1;
                            var firstItem = listEl.querySelector('.item');
                            if (firstItem) {
                                var items = listEl.querySelectorAll('.item');
                                var firstTop = items[0].offsetTop;
                                cols = 0;
                                for(var i=0; i<items.length; i++) {
                                    if(items[i].offsetTop === firstTop) cols++;
                                    else break;
                                }
                            }
                            if (cols === 0) cols = 1;

                            if (d === 1) { 
                                if (this.idx + cols < dataLen) this.idx += cols;
                                else this.idx = dataLen - 1;
                            } else if (d === 0) { 
                                if (this.idx >= cols) this.idx -= cols;
                                else this.zone = 1; 
                            } else if (d === 2) { 
                                if (this.idx % cols === 0) { 
                                    this.zone = 0;
                                    this.idx = (this.lastCatIdx > -1 ? this.lastCatIdx : 0);
                                } else {
                                    if (this.idx > 0) this.idx--;
                                }
                            } else if (d === 3) { 
                                if (this.idx < dataLen - 1 && (this.idx + 1) % cols !== 0) {
                                    this.idx++;
                                }
                            }
                        } else {
                            if(d===1) { if(typeof this.idx === 'number' && this.idx < dataLen - 1) this.idx++; }
                            else if(d===0) { if(typeof this.idx === 'number' && this.idx > 0) this.idx--; else if(this.idx === 0) this.zone = 1; } 
                            else if(d===2) { this.zone=0; this.idx=(this.lastCatIdx > -1 ? this.lastCatIdx : 0); } 
                            else if(d===3) { 
                                if (!document.getElementById('content-layer').classList.contains('vod-mode')) {
                                    this.zone=3; 
                                }
                            }
                        }
                    } else if(this.zone===1) { if(d===1) { this.zone=2; this.idx=0; } if(d===2) { this.zone=0; this.idx=(this.lastCatIdx > -1 ? this.lastCatIdx : 0); } }
                }
                this.updateFocus();
            },

            enter: function() {
                var now = new Date().getTime(); if(now - this.lastEnter < 400) return; this.lastEnter = now;
                var currentScr = this.scr; 
                if(currentScr===0) { if(this.idx === 3) this.login(false); else if(this.idx < 3) this.move(1); }
                else if(currentScr===1) { if(this.idx === 3) this.logout(); else if(this.idx === 0) this.openMode('live', true); else if(this.idx === 1) this.openMode('movie', true); else if(this.idx === 2) this.openMode('series', true); }
                else if(currentScr===3) { 
                    if(this.idx === 1) this.toggleCfg('filter'); 
                    else if(this.idx === 2) this.toggleFormat(); 
                    else if(this.idx === 3) this.closeSettings(); 
                }
                else if(currentScr===2) { if(this.zone===0) this.catClick(this.idx, true); else if(this.zone===1) this.doSearch(true); else if(this.zone===2) { this.clickItem(); } else if(this.zone===3) this.toggleFull(); }
            }
        };

        var isKeyLocked = false; 

        document.addEventListener('keydown', function(e) {
            if (isKeyLocked) { e.preventDefault(); return; }
            isKeyLocked = true;
            setTimeout(function() { isKeyLocked = false; }, 40);

            var k = e.keyCode;
            
            var isLeft = (k===37);
            var isUp = (k===38);
            var isRight = (k===39);
            var isDown = (k===40);
            var isEnter = (k===13 || k===295); 
            var isBack = (k===8 || k===27 || k===461 || k===10009 || k===88); 
            
            var isRed = (k===403 || k===82);
            var isGreen = (k===404 || k===71);
            var isYellow = (k===405 || k===89);
            var isBlue = (k===406 || k===66 || k===275); 
            var isChUp = (k===427 || k===33); 
            var isChDown = (k===428 || k===34); 

            if(document.activeElement && document.activeElement.tagName === 'INPUT' && App.scr === 0) { if(isEnter || isDown) { e.preventDefault(); App.move(1); return; } if(isUp) { e.preventDefault(); App.move(0); return; } return; }
            if(App.scr === 2 && document.activeElement && document.activeElement.tagName === 'INPUT') { 
                if(isEnter) { App.doSearch(true); return; } 
                if(isDown) { e.preventDefault(); App.zone=2; App.idx=0; App.updateFocus(); return; } 
                if(isLeft) { 
                    if (document.activeElement.value === '') {
                        e.preventDefault(); 
                        App.zone=0; 
                        App.idx=(App.lastCatIdx > -1 ? App.lastCatIdx : 0); 
                        App.updateFocus(); 
                    } 
                    return; 
                }
                if(isRight) { return; } 
                return; 
            }
            
            if(App.scr === 2 && App.currentMode === 'live') {
                if(isChUp) { e.preventDefault(); App.switchChannel(1); return; }
                if(isChDown) { e.preventDefault(); App.switchChannel(-1); return; }
            }

            if(k===48 || k===96) { if(App.scr===2 && App.zone===2) { var it=App.fullData[App.idx]; if(it) { var itId = it.stream_id || it.series_id || it.id; FavManager.toggle(itId); } } }
            
            var isVOD = (App.currentMode !== 'live' && App.scr === 2); var isFull = document.getElementById('vid-box').classList.contains('fs');
            if(isVOD) { if(k===415 || k===179 || k===19) { e.preventDefault(); App.togglePlay(); return; } if(k===412 || k===227) { e.preventDefault(); App.seek(-15); return; } if(k===417 || k===228) { e.preventDefault(); App.seek(15); return; } if(isEnter && isFull) { e.preventDefault(); App.togglePlay(); return; } }
            
            if(isFull) { 
                e.preventDefault(); 
                if(isRed || isBack) { App.exitFull(); return; } 
                if(isVOD) { if(isLeft) { App.seek(-15); return; } if(isRight) { App.seek(15); return; } } 
                return; 
            }
            
            if(isLeft) { e.preventDefault(); App.move(2); } 
            if(isUp) { e.preventDefault(); App.move(0); } 
            if(isRight) { e.preventDefault(); App.move(3); } 
            if(isDown) { e.preventDefault(); App.move(1); }
            if(isEnter) { e.preventDefault(); App.enter(); } 
            
            if(isBack) { 
                e.preventDefault(); 
                if(App.scr===3) { App.closeSettings(); return; } 
                else if(App.scr>0) { App.back(true); return; } 
            }
            
            if(isRed) if(App.scr===2) App.toggleFull(); 
            if(isGreen) if(App.scr===2) { App.zone=0; App.idx=0; App.updateFocus(); } 
            if(isYellow) if(App.scr===2) { App.zone=1; App.updateFocus(); } 
            if(isBlue) { e.preventDefault(); if(App.scr===2) App.openSettings(); } 
        });

        window.addEventListener('beforeunload', function() { PlayerEngine.hardStop(); });
        window.addEventListener('unload', function() { PlayerEngine.hardStop(); });
        window.addEventListener('pagehide', function() { PlayerEngine.hardStop(); });
    </script>
