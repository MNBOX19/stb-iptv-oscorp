<style>
:root{--bg-deep:#000;--main-color:#FFD700;--font-xs:1.8vh;--font-sm:2.2vh;--font-md:3vh;--font-lg:5vh}
*{margin:0;padding:0;box-sizing:border-box;outline:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{background:#000;color:#fff;font-family:'Montserrat',sans-serif;position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;overflow:hidden!important;overscroll-behavior:none;touch-action:none;transform:translate3d(0,0,0);-webkit-transform:translate3d(0,0,0);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.hide{display:none!important}.flex-center{display:flex;align-items:center;justify-content:center}.layer{position:fixed;top:0;left:0;width:100%;height:100%;z-index:10;background:transparent;overflow:hidden}

.phone-icon{font-size:10vh;margin-bottom:20px;animation:rotatePhone 2s infinite ease-in-out}
@keyframes rotatePhone{0%,100%{transform:rotate(0);opacity:0}25%,50%{transform:rotate(-90deg);opacity:1}75%{transform:rotate(-90deg);opacity:0}}
@media screen and (max-width:768px) and (orientation:portrait){#orientation-overlay{display:flex!important}}
button,.smart-card,.cat-item,.item,.power-btn,.key,.toggle-btn{cursor:pointer}
.focused{border:3px solid #fff!important;background:var(--main-color)!important;color:#000!important;z-index:50;box-shadow:none!important;transform:scale(1.02) translateZ(0)!important;transition:transform .1s ease-out,background .1s}
.focused i,.focused span,.focused div{color:#000!important}
#vid-box.focused{border:4px solid var(--main-color)!important;background:transparent!important;transform:none!important}
#vid-box.fs,#vid-box.fs.focused{border:none!important;width:100%!important;height:100%!important;z-index:9999!important;position:fixed!important;top:0!important;left:0!important;background:#000!important;transform:none!important}
.login-box{width:450px;max-width:90%;padding:40px;background:#0a0a0a;border:2px solid var(--main-color);border-radius:12px;text-align:center}
.logo-txt{font-size:4.5vh;font-weight:900;margin-bottom:2.5vh}.theme-text{color:var(--main-color)}
.inp{width:100%;padding:16px;margin:10px 0;background:#1a1a1a;border:1px solid #333;color:#fff;text-align:center;font-weight:600;border-radius:8px;font-size:16px}
.btn{width:100%;padding:16px;margin-top:20px;background:var(--main-color);color:#000;border:none;font-weight:900;border-radius:8px;font-size:16px}
.btn-logout{background:#333;color:#fff;margin-top:10px;border:1px solid #444}
.config-row{display:flex;gap:1vw;margin:2vh 0}.toggle-btn{flex:1;padding:1.5vh;background:#1a1a1a;border:1px solid #333;color:#888;font-size:var(--font-sm);font-weight:800;border-radius:1vh}
.info-row{display:flex;justify-content:space-between;padding:1vh 0;border-bottom:1px solid #222;font-size:var(--font-sm);color:#ccc}
#dash-layer{display:flex;flex-direction:column;padding:4vh 4vw;height:100%;overflow:hidden}
.top-bar{display:flex;justify-content:space-between;align-items:center;height:14vh;margin-bottom:2vh;flex-shrink:0}.dash-logo{font-size:var(--font-lg);font-weight:900}.dash-clock{text-align:right}.clock-time{font-size:6vh;font-weight:700;color:#eee;line-height:1}.clock-date{font-size:2.5vh;color:#ccc;font-weight:600;margin-top:.8vh}
@keyframes pulse-btn{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,215,0,.4)}50%{transform:scale(1.15);box-shadow:0 0 20px 5px rgba(255,215,0,.8)}100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,215,0,0)}}
.top-actions{display:flex;gap:2vh}.power-btn{width:7vh;height:7vh;font-size:3.5vh;background:transparent;border:none;color:#666;display:flex;align-items:center;justify-content:center;transition:all .3s ease;border-radius:50%}
.power-btn.focused{animation:pulse-btn 1.2s infinite;background:var(--main-color)!important;color:#000!important}

#content-layer{display:flex;width:100%;height:100%;background:#000;overflow:hidden}.col-cat{width:25%;background:#08080a;display:flex;flex-direction:column;border-right:2px solid #1a1a1a;height:100%;overflow:hidden;flex-shrink:0}.col-list{width:35%;background:#101014;display:flex;flex-direction:column;border-right:2px solid #1a1a1a;height:100%;overflow:hidden}.col-play{flex:1;display:flex;flex-direction:column;position:relative;background:#000;height:100%;overflow:hidden}
#content-layer.mode-grid .col-list{width:75%;border-right:none}#content-layer.mode-grid .col-play{position:absolute;z-index:-1;opacity:0;width:1px;height:1px;pointer-events:none}#content-layer.mode-grid .col-play .vid-box.fs{opacity:1;pointer-events:auto;z-index:9999}
.cat-head{padding:15px;background:#15151a;color:var(--main-color);border-bottom:2px solid #222;text-align:center;font-size:var(--font-md);font-weight:900;flex-shrink:0}.cat-top-row{display:flex;align-items:center;width:100%}.cat-list,.item-list{flex:1;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;will-change:transform;transform:translateZ(0);touch-action:pan-y}
.cat-item{padding:14px 20px;border-radius:6px;margin:6px 12px;color:#888;font-size:var(--font-sm);font-weight:700;border:1px solid transparent}.cat-item.active{background:#1a1a1a;color:#fff;border-left:4px solid var(--main-color)}
.search-area{padding:15px;background:#050505;border-bottom:2px solid #1a1a1a;flex-shrink:0}.inp-search{width:100%;padding:12px;background:#111;border:1px solid #333;color:#fff;font-size:var(--font-sm);font-weight:bold;border-radius:6px;text-transform:uppercase;text-align:center}
/* Optimizacao de Navegacao (Content Visibility) */
.item{padding:14px 20px;border-radius:6px;margin:6px 12px;color:#888;font-size:var(--font-sm);font-weight:700;border-bottom:1px solid #1a1a1a;content-visibility:auto;contain-intrinsic-size:50px;}
.item.playing{color:var(--main-color);background:#111;border-left:4px solid var(--main-color)}.fav-icon{float:right;color:var(--main-color)}
.item-list.grid-view{display:flex;flex-wrap:wrap;align-content:flex-start;padding:1vw}
.item-list.grid-view .item{flex:0 0 16.6666%;max-width:16.6666%;padding:.8vw;border:none!important;background:transparent!important;margin:0;display:flex;flex-direction:column;content-visibility:auto;contain-intrinsic-size:15vw 25vw;}
.item-cover-wrapper{position:relative;width:100%;padding-top:150%;background:#111;border-radius:8px;border:3px solid transparent;overflow:hidden;transition:all .2s ease;box-shadow:0 4px 10px rgba(0,0,0,.4)}.item-cover{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.item-list.grid-view .item.focused{transform:scale(1.05) translateZ(0)!important;background:transparent!important;border:none!important;z-index:50}.item-list.grid-view .item.focused .item-cover-wrapper{border-color:var(--main-color);box-shadow:0 0 20px var(--main-color)}.item-list.grid-view .item.playing .item-cover-wrapper{border-color:var(--main-color)}
.item-list.grid-view .item-title{margin-top:1vh;font-size:1.8vh;color:#eee;text-align:center;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal}
/* --- */
.vid-box{width:100%;height:50vh;background:#000;position:relative;border-bottom:2px solid #222;overflow:hidden;flex-shrink:0;touch-action:manipulation;transform:translateZ(0)}
#player-container{width:100%;height:100%;background:#000;transform:translateZ(0)}video{width:100%;height:100%;object-fit:fill;background:#000;z-index:1;transform:translateZ(0)}
.buffer-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center}.buffer-spinner{font-size:8vh;color:var(--main-color);text-shadow:0 0 15px rgba(255,215,0,.5)}
.meta{padding:25px;flex:1;height:100%;overflow-y:auto;background:#0a0a0c;display:flex;flex-direction:column}.meta-title{font-size:var(--font-lg);color:var(--main-color);font-weight:900;margin-bottom:1vh}.meta-desc{font-size:var(--font-sm);color:#999;margin-bottom:1vh}
.keys{display:flex;justify-content:space-between;align-items:center;gap:1vw;padding-top:2vh;border-top:2px solid #1a1a1a;margin-top:auto;flex-shrink:0}.key{flex:1;font-size:var(--font-xs);color:#fff;font-weight:700;background:#1a1a1a;border:1px solid #333;padding:1.2vh .5vw;border-radius:.8vh;display:flex;align-items:center;justify-content:center;white-space:nowrap}.dot{width:1.2vh;height:1.2vh;border-radius:50%;flex-shrink:0;margin-right:1.2vw}
#loader{background:#000;z-index:20000;flex-direction:column;color:var(--main-color);font-weight:900;font-size:var(--font-lg)}#pause-layer{display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:9000;align-items:center;justify-content:center;pointer-events:none}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#444;border-radius:10px}
</style>
