<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <meta http-equiv="Cache-Control" content="max-age=3600, public">
    
    <title>IPTV OSCORP</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" media="print" onload="this.media='all'">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

    <style>
        :root {
            --bg-deep: #000000;
            --main-color: #FFD700; /* Tom GOLD */
            --bg-smarters: #0a0a0c;
            --font-xs: 1.8vh; --font-sm: 2.2vh; --font-md: 3vh; --font-lg: 5vh;
        }

        * { 
            margin: 0; padding: 0; box-sizing: border-box; outline: none; 
            -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;           
        }
        
        html, body {
            background: #000000; color: #ffffff; font-family: 'Montserrat', sans-serif;
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; 
            overflow: hidden !important; overscroll-behavior: none; touch-action: none;
            transform: translate3d(0,0,0); -webkit-transform: translate3d(0,0,0);
            backface-visibility: hidden; -webkit-backface-visibility: hidden;
        }

        .hide { display: none !important; }
        .flex-center { display: flex; align-items: center; justify-content: center; }
        .layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; background: transparent; overflow: hidden; }

        #orientation-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 99999; flex-direction: column; align-items: center; justify-content: center;
            color: var(--main-color); text-align: center; font-weight: 900; font-size: 3vh;
        }
        .phone-icon { font-size: 10vh; margin-bottom: 20px; animation: rotatePhone 2s infinite ease-in-out; }
        @keyframes rotatePhone { 0%, 100% { transform: rotate(0deg); opacity: 0; } 25%, 50% { transform: rotate(-90deg); opacity: 1; } 75% { transform: rotate(-90deg); opacity: 0; } }
        @media screen and (max-width: 768px) and (orientation: portrait) { #orientation-overlay { display: flex !important; } }

        button, .smart-card, .cat-item, .item, .power-btn, .toggle-btn { cursor: pointer; }
        
        /* FOCO ATUALIZADO PELO SEU CÓDIGO */
        .focused { 
            border: 3px solid #fff !important; background: var(--main-color) !important; color: #000 !important; 
            z-index: 50; box-shadow: none !important; transform: scale(1.02) translateZ(0) !important;
            transition: transform 0.1s ease-out, background 0.1s;
        }
        .focused i, .focused span, .focused div { color: #000 !important; }
        
        #vid-box.focused { border: 4px solid var(--main-color) !important; background: transparent !important; transform: none !important; }
        #vid-box.fs, #vid-box.fs.focused { border: none !important; width: 100% !important; height: 100% !important; z-index: 9999 !important; position: fixed !important; top: 0 !important; left: 0 !important; background: #000 !important; transform: none !important; }

        .login-box { width: 450px; max-width: 90%; padding: 40px; background: #0a0a0a; border: 2px solid var(--main-color); border-radius: 12px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .logo-txt { font-size: 4.5vh; font-weight: 900; margin-bottom: 2.5vh; }
        .theme-text { color: var(--main-color); }
        .inp { width: 100%; padding: 16px; margin: 10px 0; background: #1a1a1a; border: 1px solid #333; color: #fff; text-align: center; font-weight: 600; border-radius: 8px; font-size: 16px; transition: all 0.2s; }
        .btn { width: 100%; padding: 16px; margin-top: 20px; background: var(--main-color); color: #000; border: none; font-weight: 900; border-radius: 8px; font-size: 16px; transition: all 0.2s; }
        .btn-logout { background: #333; color: #fff; margin-top: 10px; border: 1px solid #444; }

        .config-row { display: flex; gap: 1vw; margin: 2vh 0; }
        .toggle-btn { flex: 1; padding: 1.5vh; background: #1a1a1a; border: 1px solid #333; color: #888; font-size: var(--font-sm); font-weight: 800; border-radius: 1vh; transition: all 0.2s; }
        .info-row { display: flex; justify-content: space-between; padding: 1vh 0; border-bottom: 1px solid #222; font-size: var(--font-sm); color: #ccc; }
        
        #dash-layer { display: flex; flex-direction: column; padding: 4vh 4vw; height: 100%; overflow: hidden; background: radial-gradient(circle at center, #111 0%, #000 100%); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; height: 14vh; margin-bottom: 2vh; flex-shrink: 0; }
        .dash-logo { font-size: var(--font-lg); font-weight: 900; }
        .dash-clock { text-align: right; }
        .clock-time { font-size: 6vh; font-weight: 700; color: #eee; line-height: 1; }
        .clock-date { font-size: 2.5vh; color: #ccc; font-weight: 600; margin-top: 0.8vh; }
        
        @keyframes pulse-btn {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.4); }
            50% { transform: scale(1.15); box-shadow: 0 0 20px 5px rgba(255, 215, 0, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); }
        }
        .top-actions { display: flex; gap: 2vh; }
        .power-btn { width: 7vh; height: 7vh; font-size: 3.5vh; background: transparent; border: none; color: #666; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; border-radius: 50%; }
        .power-btn.focused { animation: pulse-btn 1.2s infinite; background: var(--main-color) !important; color: #000 !important; }

        .dash-grid { display: flex; gap: 4vw; justify-content: center; align-items: center; flex: 1; width: 100%; }
        
        .smart-card { 
            width: 24vw; 
            height: 48vh; 
            background: linear-gradient(180deg, #1a1a1a 0%, #0a0a0a 100%); 
            border: 2px solid #222; 
            border-radius: 2vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            transition: transform 0.2s ease-out, border-color 0.2s, box-shadow 0.2s;
        }
        .smart-card svg { color: #aaa; transition: color 0.2s; }
        .smart-card span { font-size: 3.5vh; font-weight: 900; color: #fff; text-transform: uppercase; margin-top: 1vh; transition: color 0.2s; }

        .bottom-bar { display: flex; justify-content: space-between; margin-top: auto; padding-bottom: 1vh; flex-shrink: 0; }
        .info-pill { background: #111; padding: 1.5vh 2.5vw; border-radius: 50px; border: 1px solid #222; }
        .lbl { font-size: var(--font-xs); color: #999; display: block; font-weight: 700; }
        .val { font-size: var(--font-md); color: var(--main-color); font-weight: 900; }

        #content-layer { display: flex; width: 100%; height: 100%; background: var(--bg-smarters); overflow: hidden; }
        
        .layout-live .col-cat { width: 25%; }
        .layout-live .col-list { width: 35%; }
        .layout-live .col-play { display: flex; width: 40%; }

        .layout-vod .col-cat { width: 25%; }
        .layout-vod .col-list { width: 75%; }
        .layout-vod .col-play { display: none; }
        
        .layout-vod.playing-vod .col-play { 
            display: flex !important; position: fixed !important; top: 0; left: 0; 
            width: 100% !important; height: 100% !important; z-index: 99999; 
        }

        .col-cat { background: #050505; display: flex; flex-direction: column; border-right: 1px solid #1a1a1a; height: 100%; overflow: hidden; transition: width 0.3s; }
        .col-list { background: var(--bg-smarters); display: flex; flex-direction: column; border-right: 1px solid #1a1a1a; height: 100%; overflow: hidden; transition: width 0.3s; }
        .col-play { flex-direction: column; position: relative; background: #000; height: 100%; overflow: hidden; }

        .cat-head { padding: 15px; background: #0a0a0c; color: var(--main-color); border-bottom: 1px solid #1a1a1a; text-align: left; font-size: var(--font-md); font-weight: 900; flex-shrink: 0; }
        .cat-top-row { display: flex; align-items: center; width: 100%; }
        
        /* Otimização de rolagem compatível */
        .cat-list, .item-list { 
            flex: 1; height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; 
            transform: translateZ(0); touch-action: pan-y;
        }
        
        .cat-item { 
            padding: 16px 20px; margin: 0; color: #ccc; font-size: var(--font-sm); font-weight: 600; 
            border-bottom: 1px solid #1a1a1a; border-left: 5px solid transparent;
            white-space: normal; word-wrap: break-word; transition: all 0.1s;
        }
        .cat-item.active { background: #111; color: var(--main-color); border-left-color: var(--main-color); font-weight: 800; }
        .cat-item.focused { background: #1a1a1a !important; border-left-color: var(--main-color) !important; color: #fff !important; transform: scale(1.02) translateZ(0); }
        
        .search-area { padding: 15px; background: #0a0a0c; border-bottom: 1px solid #1a1a1a; flex-shrink: 0; }
        .inp-search { width: 100%; padding: 12px; background: #111; border: 1px solid #333; color: #fff; font-size: var(--font-sm); font-weight: bold; border-radius: 6px; text-transform: uppercase; text-align: left; padding-left: 20px;}
        
        /* Lista de Canais TV */
        .layout-live .item { 
            padding: 15px 20px; border-bottom: 1px solid #1a1a1a; border-left: 5px solid transparent;
            color: #ccc; font-size: var(--font-sm); font-weight: 600; transition: all 0.1s;
        }
        .layout-live .item.playing { color: var(--main-color); background: rgba(255,215,0,0.05); border-left-color: var(--main-color); }
        
        /* ESTILO CORRIGIDO PARA SMART TVs ANTIGAS (Philco, Tizen, WebOS) */
        .layout-vod .item-list { 
            display: block; /* Remove CSS Grid e usa fallback universal */
            padding: 2vw; 
            text-align: left;
        }
        .layout-vod .item {
            display: inline-block; /* Empilha os itens lado a lado perfeitamente */
            vertical-align: top;
            width: 17%; /* 5 itens por linha (5 * 17% = 85%, sobra espaço pras margens) */
            margin: 0 1.2% 2vw 1.2%;
            border: 3px solid transparent; border-radius: 8px; padding: 0.5vw;
            background: transparent; height: auto; text-align: center;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        .layout-vod .item img {
            display: block;
            width: 100%; 
            height: 18vw; /* Altura fixa garantida para navegadores sem suporte a aspect-ratio */
            object-fit: cover; border-radius: 6px;
            margin-bottom: 1vh; background: #111; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        /* Aplica a proporção perfeita apenas se a TV suportar */
        @supports (aspect-ratio: 2/3) {
            .layout-vod .item img { height: auto; aspect-ratio: 2/3; }
        }

        .layout-vod .item .item-title {
            font-size: 1.6vh; font-weight: 600; color: #ccc; line-height: 1.3;
            overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; width: 100%;
        }

        .fav-icon { float: right; color: var(--main-color); margin-top: 2px; }
        .layout-vod .fav-icon { position: absolute; top: 10px; right: 10px; font-size: 2.5vh; text-shadow: 0 2px 5px #000; }

        .vid-box { 
            width: 100%; height: 50vh; background: #000; position: relative; border-bottom: 2px solid #1a1a1a; overflow: hidden; flex-shrink: 0;
            touch-action: manipulation; transform: translateZ(0); 
        }
        
        #player-container { width:100%; height:100%; background:#000; transform: translateZ(0); }
        video { width: 100%; height: 100%; object-fit: fill; background: #000; z-index: 1; transform: translateZ(0); }

        .buffer-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 50; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .buffer-spinner { font-size: 8vh; color: var(--main-color); text-shadow: 0 0 15px rgba(255, 215, 0, 0.5); }

        .meta { padding: 25px; flex: 1; height: 100%; overflow-y: auto; background: var(--bg-smarters); display: flex; flex-direction: column; }
        .meta-title { font-size: var(--font-lg); color: var(--main-color); font-weight: 900; margin-bottom: 1vh; word-wrap: break-word; }
        .meta-desc { font-size: var(--font-sm); color: #999; margin-bottom: 1vh; word-wrap: break-word; }
        
        .keys { display: flex; justify-content: space-between; align-items: center; gap: 1vw; padding-top: 2vh; border-top: 2px solid #1a1a1a; margin-top: auto; flex-shrink: 0; }
        .key { flex: 1; font-size: var(--font-xs); color: #fff; font-weight: 700; background: #1a1a1a; border: 1px solid #333; padding: 1.2vh 0.5vw; border-radius: 0.8vh; display: flex; align-items: center; justify-content: center; white-space: nowrap; }
        #key-menu { cursor: pointer; transition: background 0.2s; }
        #key-menu:active { background: #222; }

        .dot { width: 1.2vh; height: 1.2vh; border-radius: 50%; flex-shrink: 0; margin-right: 1.2vw; }

        #loader { background: #000; z-index: 20000; flex-direction: column; color: var(--main-color); font-weight: 900; font-size: var(--font-lg); }
        #pause-layer { display: none; position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: 9000; align-items: center; justify-content: center; pointer-events: none; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
    </style>
</head>
<body onload="App.init()">

    <div id="orientation-overlay">
        <i class="fas fa-mobile-alt phone-icon"></i>
        <div>POR FAVOR<br><span style="color: var(--main-color);">GIRE A TELA</span></div>
    </div>

    <div id="loader" class="hide flex-center">
        <i class="fas fa-circle-notch fa-spin" style="margin-bottom:20px; font-size: 8vh;"></i>
        <div id="load-txt">CARREGANDO SISTEMA...</div>
    </div>

    <div id="login-layer" class="layer flex-center hide">
        <div class="login-box">
            <div class="logo-txt"><span style="color:#fff">IPTV</span>&nbsp;<span class="theme-text">OSCORP</span></div>
            <input type="text" id="i0" class="inp focusable" placeholder="URL DNS" autocomplete="off">
            <input type="text" id="i1" class="inp focusable" placeholder="USUÁRIO" autocomplete="off">
            <input type="password" id="i2" class="inp focusable" placeholder="SENHA" autocomplete="off">
            <button id="i3" class="btn focusable" onclick="App.login(false)">ENTRAR AGORA</button>
            <div id="msg-login" style="color:var(--main-color); margin-top:20px; font-size:var(--font-sm); font-weight: 800;"></div>
        </div>
    </div>

    <div id="settings-layer" class="layer hide flex-center">
        <div class="login-box">
            <div class="logo-txt" id="set-title-txt"><i class="fas fa-user-shield" style="margin-right:10px; color: var(--main-color);"></i>MINHA <span class="theme-text">CONTA</span></div>
            <div class="info-row"><span id="lbl-set-u">USUÁRIO:</span> <span id="set-user">...</span></div>
            <div class="info-row"><span id="lbl-set-d">CRIADO:</span> <span id="set-created">...</span></div>
            <div class="info-row"><span id="lbl-set-e">VENCIMENTO:</span> <span id="set-exp">...</span></div>
            <div class="info-row"><span id="lbl-set-c">TELAS:</span> <span id="set-conn">...</span></div>
            
            <div class="config-row" style="margin-top: 30px;"><div id="s0" class="toggle-btn focusable" style="border-color: #333; background: #111; cursor: default;">OPÇÕES</div></div>
            <div class="config-row">
                <div id="s1" class="toggle-btn focusable" onclick="App.toggleCfg('filter')"><span id="lbl-set-filter">XXX:</span> <span id="lbl-filter" style="color:#fff">NÃO</span></div>
                <div id="s2" class="toggle-btn focusable" onclick="App.toggleFormat()"><span id="lbl-set-format">FMT:</span> <span id="lbl-format" style="color:#fff">HLS (M3U8)</span></div>
            </div>
            
            <button id="s3" class="btn focusable" onclick="App.closeSettings()" style="background: #333; color: #fff; margin-top: 20px;">VOLTAR</button>
            <button id="s4" class="btn btn-logout focusable" onclick="App.logout()">SAIR / DESLOGAR</button>
        </div>
    </div>

    <div id="dash-layer" class="layer hide">
        <div class="top-bar">
            <div class="dash-logo"><span style="color:#fff">IPTV</span>&nbsp;<span class="theme-text">OSCORP</span></div>
            <div class="dash-clock"><div id="clock-time" class="clock-time">--:--</div><div id="clock-date" class="clock-date">--/--/----</div></div>
            <div class="top-actions">
                <div id="m3" class="power-btn focusable" onclick="App.logout()"><i class="fas fa-power-off"></i></div>
            </div>
        </div>
        <div class="dash-grid">
            <div id="m0" class="smart-card focusable" role="button" tabindex="-1" onclick="App.openMode('live')">
                <svg viewBox="0 0 24 24" width="8vh" height="8vh" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 2vh;">
                  <rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect>
                  <polyline points="17 2 12 7 7 2"></polyline>
                  <circle cx="17" cy="14" r="1.5" fill="currentColor"></circle>
                  <circle cx="17" cy="18" r="1.5" fill="currentColor"></circle>
                </svg>
                <span id="dash-m0">TV AO VIVO</span>
            </div>
            <div id="m1" class="smart-card focusable" role="button" tabindex="-1" onclick="App.openMode('movie')">
                <svg viewBox="0 0 24 24" width="8vh" height="8vh" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 2vh;">
                  <rect x="2" y="10" width="14" height="10" rx="2" ry="2"></rect>
                  <polygon points="16 12 23 9 23 21 16 18"></polygon>
                  <circle cx="6" cy="5" r="3"></circle>
                  <circle cx="12" cy="5" r="3"></circle>
                </svg>
                <span id="dash-m1">FILMES</span>
            </div>
            <div id="m2" class="smart-card focusable" role="button" tabindex="-1" onclick="App.openMode('series')">
                <svg viewBox="0 0 24 24" width="8vh" height="8vh" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 2vh;">
                  <rect x="2" y="3" width="20" height="18" rx="2" ry="2"></rect>
                  <line x1="2" y1="8" x2="22" y2="8"></line>
                  <line x1="2" y1="16" x2="22" y2="16"></line>
                  <line x1="6" y1="3" x2="6" y2="21"></line>
                  <line x1="18" y1="3" x2="18" y2="21"></line>
                  <polygon points="10 10 15 12 10 14" fill="currentColor"></polygon>
                </svg>
                <span id="dash-m2">SÉRIES</span>
            </div>
        </div>
        <div class="bottom-bar">
            <div class="info-pill"><span class="lbl" id="lbl-exp-txt">VENCIMENTO</span><span id="info-exp" class="val">...</span></div>
            <div class="info-pill" style="text-align: right;"><span class="lbl" id="lbl-conn-txt">CONEXÕES</span><span id="info-conn" class="val">...</span></div>
        </div>
    </div>

    <div id="content-layer" class="layer hide layout-live">
        <div class="col-cat">
            <div class="cat-head">
                <div class="cat-top-row">
                    <div id="cat-title-txt" style="flex:1;">MENU</div>
                </div>
                <div id="item-count" style="font-size: 0.7em; margin-top: 5px; opacity: 0.7; color: #fff;">TOTAL: ...</div>
            </div>
            <div id="cat-list" class="cat-list"></div>
        </div>
        
        <div class="col-list">
            <div class="search-area"><input type="text" id="search" class="inp-search focusable" placeholder="BUSCAR NA CATEGORIA..." autocomplete="off"></div>
            <div id="item-list" class="item-list"></div>
        </div>
        
        <div class="col-play">
            <div id="vid-box" class="vid-box focusable" onclick="App.handleVideoTap(event)">
                <div id="player-container">
                    <video id="player" playsinline webkit-playsinline></video>
                </div>
                
                <div id="smart-buffer" class="buffer-overlay">
                    <i class="fas fa-circle-notch fa-spin buffer-spinner"></i>
                </div>

                <div id="pause-layer"><i class="fas fa-pause" style="font-size: 10vh; color: rgba(255, 255, 255, 0.9); text-shadow: 0 0 20px #000;"></i></div>
            </div>
            
            <div class="meta">
                <div id="meta-title" class="meta-title"><span style="color:#fff">IPTV</span>&nbsp;OSCORP</div>
                <div id="meta-desc" class="meta-desc"></div>
                
                <div class="keys">
                    <div class="key" id="key-fs"><div class="dot" style="background-color:#FF0000; box-shadow: 0 0 10px #FF0000;"></div> TELA CHEIA</div>
                    <div class="key" id="key-top"><div class="dot" style="background-color:#00C851; box-shadow: 0 0 10px #00C851;"></div> TOPO</div>
                    <div class="key" id="key-search"><div class="dot" style="background-color:#ffbb33; box-shadow: 0 0 10px #ffbb33;"></div> BUSCAR</div>
                    <div class="key" id="key-menu" onclick="App.openSettings()"><div class="dot" style="background-color:#33b5e5; box-shadow: 0 0 10px #33b5e5;"></div> CONFIG.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function safePlay(vidElement) {
            if (!vidElement) return;
            try { 
                var p = vidElement.play(); 
                if (p !== undefined && typeof p.catch === 'function') { 
                    p.catch(function(e) {}); 
                } 
            } catch (e) {}
        }

        function requestNativeFullscreen(elem) {
            var target = elem || document.documentElement;
            try {
                if (target.requestFullscreen) { var p = target.requestFullscreen(); if(p !== undefined && typeof p.catch === 'function') { p.catch(function(){}); } } 
                else if (target.webkitRequestFullscreen) { target.webkitRequestFullscreen(); }
            } catch (e) {}
        }

        var FavManager = {

            var isVOD = (App.currentMode !== 'live' && App.scr === 2); var isFull = document.getElementById('vid-box').classList.contains('fs');
            if(isVOD) { if(k===415 || k===179 || k===19) { e.preventDefault(); App.togglePlay(); return; } if(k===412 || k===227) { e.preventDefault(); App.seek(-15); return; } if(k===417 || k===228) { e.preventDefault(); App.seek(15); return; } if(isEnter && isFull) { e.preventDefault(); App.togglePlay(); return; } }
            
            if(isFull) {

            if(isLeft) { e.preventDefault(); App.move(2); }

            if(isBack) {

            }
            
            if(isRed) if(App.scr===2) App.toggleFull(); 
            if(isGreen) if(App.scr===2) { App.zone=0; App.idx=0; App.updateFocus(); } 
            if(isYellow) if(App.scr===2) { App.zone=1; App.updateFocus(); } 
            if(isBlue) { e.preventDefault(); if(App.scr===2) App.openSettings(); } 
        });
